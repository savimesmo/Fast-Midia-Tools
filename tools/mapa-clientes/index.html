:root {
  --bg: #FFFFFF;
  --surface: #F7F5F5;
  --text: #1A1A1A;
  --text-muted: #8A8080;
  --red-700: #B91C3B;
  --red-600: #C41E3A;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #151010; --surface: #1E1818; --text: #F0EAEA; --text-muted: #877A7A;
    --red-700: #E85D75; --red-600: #DC2F4A; color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #151010; --surface: #1E1818; --text: #F0EAEA; --text-muted: #877A7A;
  --red-700: #E85D75; --red-600: #DC2F4A; color-scheme: dark;
}
*{box-sizing:border-box;margin:0}
html,body{height:100%}
body{background:var(--bg);color:var(--text);font-family:'DM Sans',system-ui,sans-serif;padding:0}
#map{width:100%;height:calc(100% - 56px);min-height:400px}
.bar{height:56px;display:flex;align-items:center;justify-content:space-between;padding:0 16px;background:var(--surface);border-bottom:2px solid var(--red-600);gap:12px;flex-wrap:wrap}
.bar h1{font-size:1rem;font-weight:700;color:var(--red-700);white-space:nowrap}
.fl{display:flex;gap:6px;align-items:center}
.fb{border:none;padding:5px 14px;border-radius:16px;font-family:inherit;font-size:.75rem;font-weight:600;cursor:pointer;transition:opacity .15s;color:#fff}
.fb.off{opacity:.22}
.fb[data-f="R"]{background:#C41E3A}
.fb[data-f="B"]{background:#2563EB}
.fb[data-f="G"]{background:#059669}
.lg{display:flex;gap:10px;font-size:.7rem;color:var(--text-muted);align-items:center}
.lg span{display:flex;align-items:center;gap:3px}
.ld{width:10px;height:10px;border-radius:50%;border:2px solid #fff;flex-shrink:0}
.leaflet-popup-content-wrapper{border-radius:8px!important;font-family:'DM Sans',sans-serif!important}
.leaflet-popup-content{margin:10px 14px!important;font-size:.8rem!important;line-height:1.5!important}
.pt{font-weight:700;font-size:.9rem;margin-bottom:2px}
.pa{color:#888;font-size:.72rem}
.pc{font-weight:600;margin-top:3px}
@media(max-width:600px){.bar{height:auto;padding:8px 12px}.lg{display:none}#map{height:calc(100vh - 80px)}}
</style>

  return L.divIcon({className:'',html:'<div style="display:flex;flex-direction:column;align-items:center"><div style="width:44px;height:44px;border-radius:50%;background:linear-gradient(135deg,#F59E0B,#D97706);border:3px solid #fff;box-shadow:0 3px 12px rgba(0,0,0,.45);display:flex;align-items:center;justify-content:center"><svg width="22" height="22" viewBox="0 0 24 24" fill="white"><path d="M12 7V3H2v18h20V7H12zM6 19H4v-2h2v2zm0-4H4v-2h2v2zm0-4H4V9h2v2zm0-4H4V5h2v2zm4 12H8v-2h2v2zm0-4H8v-2h2v2zm0-4H8V9h2v2zm0-4H8V5h2v2zm10 12h-8v-2h2v-2h-2v-2h2v-2h-2V9h8v10zm-2-8h-2v2h2v-2zm0 4h-2v2h2v-2z"/></svg></div><div style="margin-top:2px;background:#D97706;color:#fff;padding:1px 8px;border-radius:8px;font-size:10px;font-weight:700;font-family:DM Sans,sans-serif;white-space:nowrap;box-shadow:0 1px 4px rgba(0,0,0,.3)">VANGUARDA</div></div>',iconSize:[44,56],iconAnchor:[22,28]});
}
function mkCl(c,n){
  var s=Math.min(8+Math.sqrt(n)*3,24);
  return L.divIcon({className:'',html:'<div style="width:'+s+'px;height:'+s+'px;border-radius:50%;background:'+c+';border:2px solid rgba(255,255,255,.85);box-shadow:0 1px 3px rgba(0,0,0,.3);opacity:.8"></div>',iconSize:[s,s],iconAnchor:[s/2,s/2]});
}

L.marker(D.a,{icon:mkAgency(),zIndexOffset:2000}).bindPopup('<div class="pt" style="color:#D97706">Agência Vanguarda Martech</div><div class="pa">R. Constelação Cruzeiro do Sul, 432 - Aleixo</div>').addTo(map);

for(var f in D.h){
  var m=L.marker(D.h[f],{icon:mkHome(COL[f]),zIndexOffset:1000}).bindPopup('<div class="pt" style="color:'+COL[f]+'">'+f+'</div><div class="pa">Casa</div>');
  m.addTo(map);hm[f]=m;
}

for(var f in D.c){
  D.c[f].forEach(function(cl){
    var m=L.marker([cl[2],cl[3]],{icon:mkCl(COL[f],cl[1])}).bindPopup('<div class="pt" style="color:'+COL[f]+'">'+cl[0]+'</div><div class="pc">'+cl[1]+' agendamento'+(cl[1]>1?'s':'')+'</div><div class="pa">Fast: '+f+'</div>');
    m.addTo(map);lyr[f].push(m);
  });
}

function tog(f,b){
  vis[f]=!vis[f];b.classList.toggle('off');
  lyr[f].forEach(function(m){if(vis[f])m.addTo(map);else map.removeLayer(m)});
  if(vis[f])hm[f].addTo(map);else map.removeLayer(hm[f]);
}
</script>
